name: Verify Quote V3 Production

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Exercise current v3 production requests
        shell: bash
        env:
          SITE_URL: https://jiahao.versecraft.cn
        run: |
          set -uo pipefail
          health_code=$(curl -sS -L --max-time 20 -o /tmp/health.json -w '%{http_code}' "${SITE_URL}/healthz" || true)
          echo "HEALTH HTTP ${health_code}: $(cat /tmp/health.json 2>/dev/null || true)"
          if [ "${health_code}" != 200 ] || ! jq -e '.status == "ok" and .quoteServiceVersion == 3' /tmp/health.json >/dev/null 2>&1; then
            exit 1
          fi

          failures=0
          probe() {
            local name="$1" payload="$2" original="$3"
            local code
            code=$(curl -sS -L --max-time 55 -X POST -H 'Content-Type: application/json' \
              --data "${payload}" -o "/tmp/${name}.json" -w '%{http_code}' "${SITE_URL}/api/quote" || true)
            echo "${name} HTTP ${code}: $(cat "/tmp/${name}.json" 2>/dev/null || true)"
            if [ "${code}" != 200 ] || ! jq -e --arg original "${original}" \
              '.source == "云端文字大模型" and .serviceVersion == 3 and (.output | type == "string" and length > 1) and .output != $original' \
              "/tmp/${name}.json" >/dev/null 2>&1; then
              failures=$((failures + 1))
            fi
          }

          hao='{"input":"今天有点累。","mode":"hao","level":"豪气冲天","style":"高冷"}'
          probe hao_1 "${hao}" '今天有点累。'
          probe hao_2 "${hao}" '今天有点累。'
          probe hao_3 "${hao}" '今天有点累。'
          probe hao_extreme '{"input":"项目终于做完了。","mode":"hao","level":"自在极意豪","style":"朋友圈"}' '项目终于做完了。'
          probe dehao_1 '{"input":"我也没说什么，只是你们可能理解不了。","mode":"dehao","level":"豪气冲天","style":"高冷"}' '我也没说什么，只是你们可能理解不了。'
          probe dehao_2 '{"input":"这个底层逻辑懂的都懂。","mode":"dehao","level":"豪气冲天","style":"高冷"}' '这个底层逻辑懂的都懂。'
          echo "FAILURES=${failures}"
          test "${failures}" -eq 0
