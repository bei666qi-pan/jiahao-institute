name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jiahao-production
  cancel-in-progress: true

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run unit and integration tests
        run: npm run test:all

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full-chain E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-gate-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-gate-test-results
          path: test-results/
          retention-days: 14

  deploy:
    name: Mirror and deploy
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    outputs:
      deployed: ${{ steps.mark-release.outputs.deployed || steps.release.outputs.deployed }}
      target_sha: ${{ steps.release.outputs.target_sha }}
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_USER: ${{ vars.GITEE_USER }}
      GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
      COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
      COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Check required production configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            GITEE_TOKEN GITEE_USER GITEE_REPOSITORY
            COOLIFY_BASE_URL COOLIFY_API_KEY COOLIFY_APP_UUID PRODUCTION_URL TARGET_SHA
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing production configuration: ${name}" >&2
              exit 1
            fi
          done

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Reject superseded release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          echo 'deployed=false' >> "${GITHUB_OUTPUT}"
          echo "target_sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"
          git fetch --quiet origin main
          latest_sha=$(git rev-parse origin/main)
          checked_out_sha=$(git rev-parse HEAD)
          if [ "${checked_out_sha}" != "${TARGET_SHA}" ]; then
            echo "Checked-out SHA ${checked_out_sha} does not match target ${TARGET_SHA}." >&2
            exit 1
          fi
          if [ "${TARGET_SHA}" != "${latest_sha}" ]; then
            echo "Skipping superseded release ${TARGET_SHA}; current main is ${latest_sha}."
            exit 0
          fi
          expected_version=$(sed -n 's/^export const QUOTE_SERVICE_VERSION = \([0-9][0-9]*\);/\1/p' server/quote.mjs | head -n 1)
          if [ -z "${expected_version}" ]; then
            echo 'Unable to resolve QUOTE_SERVICE_VERSION.' >&2
            exit 1
          fi
          echo "expected_quote_service_version=${expected_version}" >> "${GITHUB_OUTPUT}"
          echo 'deployed=pending' >> "${GITHUB_OUTPUT}"

      - name: Mirror release to Gitee master
        if: steps.release.outputs.deployed == 'pending'
        shell: bash
        run: |
          set -euo pipefail
          repository_url="https://gitee.com/${GITEE_REPOSITORY}.git"
          before_sha=$(git ls-remote "${repository_url}" refs/heads/master | awk '{print $1}')
          if [ "${before_sha}" = "${TARGET_SHA}" ]; then
            echo "Gitee master already points to ${TARGET_SHA}."
          else
            basic_auth=$(printf '%s:%s' "${GITEE_USER}" "${GITEE_TOKEN}" | base64 | tr -d '\n')
            echo "::add-mask::${basic_auth}"
            git -c http.https://gitee.com/.extraheader="AUTHORIZATION: Basic ${basic_auth}" \
              push "${repository_url}" "${TARGET_SHA}:refs/heads/master"
          fi
          mirrored_sha=$(git ls-remote "${repository_url}" refs/heads/master | awk '{print $1}')
          if [ "${mirrored_sha}" != "${TARGET_SHA}" ]; then
            echo "Gitee mirror mismatch: expected ${TARGET_SHA}, got ${mirrored_sha:-missing}." >&2
            exit 1
          fi
          echo "Gitee master verified at ${mirrored_sha}."

      - name: Pin Coolify application to release commit
        if: steps.release.outputs.deployed == 'pending'
        shell: bash
        run: |
          set -euo pipefail
          application=$(curl --silent --show-error --fail \
            --header "Authorization: Bearer ${COOLIFY_API_KEY}" \
            --header 'Accept: application/json' \
            "${COOLIFY_BASE_URL%/}/api/v1/applications/${COOLIFY_APP_UUID}")
          current_repository=$(jq -r '.git_repository // "unknown"' <<<"${application}")
          current_branch=$(jq -r '.git_branch // "unknown"' <<<"${application}")
          current_commit=$(jq -r '.git_commit_sha // ""' <<<"${application}")
          echo "Coolify source before pin: ${current_repository} ${current_branch} ${current_commit:-unpinned}."

          payload=$(jq -nc --arg sha "${TARGET_SHA}" '{git_commit_sha:$sha}')
          curl --silent --show-error --fail-with-body \
            --request PATCH \
            --header "Authorization: Bearer ${COOLIFY_API_KEY}" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "${payload}" \
            "${COOLIFY_BASE_URL%/}/api/v1/applications/${COOLIFY_APP_UUID}" >/tmp/coolify-pin.json
          echo "Coolify pin response: $(cat /tmp/coolify-pin.json)"

          pinned=$(curl --silent --show-error --fail \
            --header "Authorization: Bearer ${COOLIFY_API_KEY}" \
            --header 'Accept: application/json' \
            "${COOLIFY_BASE_URL%/}/api/v1/applications/${COOLIFY_APP_UUID}")
          pinned_commit=$(jq -r '.git_commit_sha // ""' <<<"${pinned}")
          if [ "${pinned_commit}" != "${TARGET_SHA}" ]; then
            echo "Coolify commit pin mismatch: expected ${TARGET_SHA}, got ${pinned_commit:-missing}." >&2
            exit 1
          fi
          echo "Coolify application pinned to ${pinned_commit}."

      - name: Trigger Coolify deployment
        if: steps.release.outputs.deployed == 'pending'
        id: coolify
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_API_KEY}" \
            --header 'Accept: application/json' \
            "${COOLIFY_BASE_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=true")
          deployment_uuid=$(jq -er '.deployments[0].deployment_uuid' <<<"${response}")
          echo "deployment_uuid=${deployment_uuid}" >> "${GITHUB_OUTPUT}"
          echo "Coolify deployment queued: ${deployment_uuid}."

      - name: Wait for matching healthy deployment
        if: steps.release.outputs.deployed == 'pending'
        shell: bash
        env:
          DEPLOYMENT_UUID: ${{ steps.coolify.outputs.deployment_uuid }}
          EXPECTED_QUOTE_SERVICE_VERSION: ${{ steps.release.outputs.expected_quote_service_version }}
        run: |
          set -euo pipefail
          deployment_finished=false
          for attempt in $(seq 1 90); do
            deployment=$(curl --silent --show-error --fail \
              --header "Authorization: Bearer ${COOLIFY_API_KEY}" \
              --header 'Accept: application/json' \
              "${COOLIFY_BASE_URL%/}/api/v1/deployments/${DEPLOYMENT_UUID}")
            status=$(jq -r '.status // "unknown"' <<<"${deployment}")
            commit=$(jq -r '.commit // ""' <<<"${deployment}")
            echo "Deployment ${DEPLOYMENT_UUID}: ${status} commit=${commit:-unknown} (${attempt}/90)."
            case "${status}" in
              finished)
                if [ "${commit}" != "${TARGET_SHA}" ]; then
                  echo "Coolify deployed ${commit:-unknown}, expected ${TARGET_SHA}." >&2
                  exit 1
                fi
                deployment_finished=true
                break
                ;;
              failed|cancelled|canceled)
                echo "Coolify deployment ended with ${status}." >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          if [ "${deployment_finished}" != 'true' ]; then
            echo 'Timed out waiting for Coolify deployment.' >&2
            exit 1
          fi

          application_healthy=false
          for attempt in $(seq 1 30); do
            application=$(curl --silent --show-error --fail \
              --header "Authorization: Bearer ${COOLIFY_API_KEY}" \
              --header 'Accept: application/json' \
              "${COOLIFY_BASE_URL%/}/api/v1/applications/${COOLIFY_APP_UUID}")
            app_status=$(jq -r '.status // "unknown"' <<<"${application}")
            app_commit=$(jq -r '.git_commit_sha // ""' <<<"${application}")
            echo "Application status: ${app_status}, pinned=${app_commit:-missing} (${attempt}/30)."
            if [ "${app_commit}" != "${TARGET_SHA}" ]; then
              echo "Coolify application commit drifted to ${app_commit:-missing}; expected ${TARGET_SHA}." >&2
              exit 1
            fi
            if [[ "${app_status}" == *healthy* ]]; then
              application_healthy=true
              break
            fi
            if [[ "${app_status}" == exited:* ]]; then
              exit 1
            fi
            sleep 5
          done
          if [ "${application_healthy}" != 'true' ]; then
            echo 'Timed out waiting for a healthy application.' >&2
            exit 1
          fi

          runtime_matches=false
          for attempt in $(seq 1 36); do
            health_code=$(curl --silent --show-error --location --ipv4 --http1.1 \
              --connect-timeout 12 --max-time 30 \
              --output /tmp/release-health.json --write-out '%{http_code}' \
              "${PRODUCTION_URL%/}/healthz" || true)
            echo "Runtime release probe ${attempt}/36 HTTP ${health_code}: $(cat /tmp/release-health.json 2>/dev/null || true)"
            if [ "${health_code}" = '200' ] \
              && jq -e --argjson version "${EXPECTED_QUOTE_SERVICE_VERSION}" \
                '.status == "ok" and .quoteServiceVersion == $version' /tmp/release-health.json >/dev/null 2>&1; then
              runtime_matches=true
              break
            fi
            sleep 10
          done
          if [ "${runtime_matches}" != 'true' ]; then
            echo "Production runtime did not expose quote service version ${EXPECTED_QUOTE_SERVICE_VERSION}." >&2
            exit 1
          fi

      - name: Mark release ready for smoke tests
        if: steps.release.outputs.deployed == 'pending'
        id: mark-release
        shell: bash
        run: echo 'deployed=true' >> "${GITHUB_OUTPUT}"

  smoke:
    name: Production acceptance
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    uses: ./.github/workflows/diagnose-production.yml
