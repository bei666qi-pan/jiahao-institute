name: Production Smoke

on:
  workflow_call:
    inputs:
      production_url:
        description: Production origin without a trailing slash
        required: false
        default: ''
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
      url: ${{ inputs.production_url || vars.PRODUCTION_URL }}
    env:
      PRODUCTION_URL: ${{ inputs.production_url || vars.PRODUCTION_URL }}
      EXPECTED_QUOTE_SERVICE_VERSION: '2'
    steps:
      - name: Validate production URL
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PRODUCTION_URL}" != https://* ]]; then
            echo 'PRODUCTION_URL must be an https URL.' >&2
            exit 1
          fi

      - name: Wait for the matching quote service release
        shell: bash
        run: |
          set -uo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            echo "=== release probe ${attempt}/30 ==="
            health_code=$(curl --silent --show-error --location --max-time 20 \
              --output /tmp/health.json --write-out '%{http_code}' \
              "${PRODUCTION_URL%/}/healthz" || true)
            echo "health HTTP ${health_code}: $(cat /tmp/health.json 2>/dev/null || true)"
            if [ "${health_code}" = '200' ] \
              && jq -e --argjson version "${EXPECTED_QUOTE_SERVICE_VERSION}" \
                '.status == "ok" and .textModelConfigured == true and .observability.databaseHealthy == true and .quoteServiceVersion == $version' \
                /tmp/health.json >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 10
          done
          test "${ready}" = 'true'

      - name: Verify repeated quote stability and social API
        shell: bash
        run: |
          set -euo pipefail
          quote_probe() {
            local name="$1"
            local payload="$2"
            local original="$3"
            local code
            code=$(curl --silent --show-error --location --max-time 55 \
              --request POST --header 'Content-Type: application/json' \
              --data "${payload}" --output "/tmp/${name}.json" --write-out '%{http_code}' \
              "${PRODUCTION_URL%/}/api/quote")
            echo "${name} HTTP ${code}: $(cat "/tmp/${name}.json")"
            test "${code}" = '200'
            jq -e --arg original "${original}" --argjson version "${EXPECTED_QUOTE_SERVICE_VERSION}" \
              '.source == "云端文字大模型" and .serviceVersion == $version and (.output | type == "string" and length > 1) and .output != $original' \
              "/tmp/${name}.json" >/dev/null
          }

          hao_payload='{"input":"今天有点累。","mode":"hao","level":"豪气冲天","style":"高冷"}'
          quote_probe hao_first "${hao_payload}" '今天有点累。'
          quote_probe hao_second "${hao_payload}" '今天有点累。'
          quote_probe dehao '{"input":"我也没说什么，只是你们可能理解不了。","mode":"dehao","level":"豪气冲天","style":"高冷"}' '我也没说什么，只是你们可能理解不了。'

          social_code=$(curl --silent --show-error --location --max-time 20 \
            --cookie-jar /tmp/social.cookies --output /tmp/social.json --write-out '%{http_code}' \
            "${PRODUCTION_URL%/}/api/social/session")
          echo "social HTTP ${social_code}: $(cat /tmp/social.json)"
          test "${social_code}" = '200'
          jq -e '.enabled == true and (.rooms | type == "array")' /tmp/social.json >/dev/null

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise production quote UI
        run: node scripts/production-quote-smoke.mjs
