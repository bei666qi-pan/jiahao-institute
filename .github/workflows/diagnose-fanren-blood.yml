name: Diagnose Fanren Blood

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe exact production API input
        shell: bash
        env:
          SITE_URL: https://jiahao.versecraft.cn
        run: |
          set -euo pipefail
          health=$(curl -sS -L --max-time 20 "${SITE_URL}/healthz")
          echo "HEALTH=${health}"
          jq -e '.status == "ok" and .quoteServiceVersion >= 3' <<<"${health}" >/dev/null

          probe() {
            local name="$1" level="$2" style="$3"
            local body code
            body=$(jq -nc --arg input '凡人之血' --arg level "$level" --arg style "$style" \
              '{input:$input,mode:"hao",level:$level,style:$style}')
            code=$(curl -sS -L --max-time 60 -X POST -H 'Content-Type: application/json' \
              --data "${body}" -o "/tmp/${name}.json" -w '%{http_code}' "${SITE_URL}/api/quote" || true)
            echo "${name} HTTP ${code}: $(cat "/tmp/${name}.json" 2>/dev/null || true)"
          }

          probe default '豪气冲天' '高冷'
          probe extreme '自在极意豪' '战斗'
          probe social '豪气冲天' '朋友圈'
          probe signature '自在极意豪' '个性签名'
          probe repeat '豪气冲天' '高冷'

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Probe exact production browser interaction
        shell: bash
        env:
          SITE_URL: https://jiahao.versecraft.cn
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', (error) => errors.push(error.message));
            await page.goto(process.env.SITE_URL, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.locator('.site-header nav button', { hasText: '语录生成器' }).click();
            const input = page.getByLabel('要转换的原句');
            await input.fill('凡人之血');
            const output = page.locator('.quote-output blockquote');
            const before = (await output.textContent())?.trim() || '';
            const [response] = await Promise.all([
              page.waitForResponse((r) => r.url().endsWith('/api/quote') && r.request().method() === 'POST', { timeout: 60000 }),
              page.locator('button.quote-generate').click(),
            ]);
            const body = await response.json();
            await page.waitForTimeout(800);
            const after = (await output.textContent())?.trim() || '';
            console.log(JSON.stringify({ status: response.status(), body, before, after, errors }, null, 2));
            if (!response.ok()) process.exitCode = 1;
          } finally {
            await browser.close();
          }
          NODE
