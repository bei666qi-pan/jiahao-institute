name: Full-chain E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TEST_DATABASE_URL: postgres://jiahao_test:jiahao_test@127.0.0.1:5432/jiahao_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jiahao_test
          POSTGRES_PASSWORD: jiahao_test
          POSTGRES_DB: jiahao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jiahao_test -d jiahao_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run unit and integration tests
        run: npm run test:all

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full-chain E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
