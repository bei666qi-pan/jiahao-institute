name: Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    # Cold npm cache installs can exceed five minutes on GitHub-hosted runners.
    # Keep the timeout above the install phase so failures represent the tests.
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://jiahao_test:jiahao_test@127.0.0.1:5432/jiahao_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jiahao_test
          POSTGRES_PASSWORD: jiahao_test
          POSTGRES_DB: jiahao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jiahao_test -d jiahao_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:all

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: true
